controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.5
    wheel_radius: 0.15

    # CORRECTIF BUG IDENTIFIÉ : ce plugin ne doit PAS publier la TF
    # odom -> base_footprint. Cette responsabilité appartient exclusivement
    # à ekf_filter_node_odom (voir gps_ekf.yaml). Publier depuis les deux
    # côtés corrompt la TF de façon intermittente (conflit de "dernier écrivain").
    enable_odom_tf: false
    publish_rate: 50.0

    # cmd_vel arrive ici en dernier dans la chaîne de sécurité :
    # cmd_vel_safety_node -> hitch_angle_stabilizer -> diff_drive_controller
    # Un seul de ces nœuds doit effectivement publier sur /cmd_vel côté
    # entrée du contrôleur (bug n°1 déjà identifié : triple publieur).
    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    base_frame_id: base_footprint
    odom_frame_id: odom
